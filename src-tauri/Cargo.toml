[package]
name = "ai-game-maker"
version = "5.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5" }

[dependencies]
tauri = { version = "2.9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
